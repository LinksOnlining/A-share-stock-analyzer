name: Build Windows exe

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: PyInstaller build exe
        run: pyinstaller --clean --noconfirm stock_analyzer.spec

      - name: Prepare artifact
        shell: powershell
        run: |
          $dir = "dist"
          Get-ChildItem $dir -Filter "*.exe" | ForEach-Object {
            Copy-Item $_.FullName "$dir\A-share-stock-analyzer.exe" -Force
          }
          Get-ChildItem $dir -Filter "*.exe" | ForEach-Object {
            Write-Host "Build complete: $($_.Name) ($([math]::Round($_.Length / 1MB, 1))) MB"
          }

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-exe
          path: dist/A-share-stock-analyzer.exe
