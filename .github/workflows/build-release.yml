# ============================================================
# GitHub Actions 工作流：自动打包 Windows exe 并发布 Release
#
# 触发方式（任选其一）：
#   1. 推送 git tag（如 v5.0.0）→ 自动打包
#   2. 在 Actions 页面手动点击 "Run workflow"
#
# 产出：dist/A股智能股票分析工具.exe 自动挂到 Releases 下载页
# ============================================================
name: Build Windows exe

on:
  # 推送版本标签时触发（git tag v5.0.0 && git push origin v5.0.0）
  push:
    tags:
      - 'v*'
  # 支持手动触发
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      # 1. 检出代码
      - name: Checkout code
        uses: actions/checkout@v4

      # 2. 安装 Python 3.10
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      # 3. 安装运行依赖 + 打包依赖
      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r build_requirements.txt

      # 4. 用 PyInstaller 打包（spec 已配置单文件+控制台+静态资源）
      - name: Build exe with PyInstaller
        run: |
          pyinstaller --clean --noconfirm stock_analyzer.spec

      # 5. 重命名为英文名，避免部分下载器对中文文件名的兼容问题
      - name: Prepare artifact
        shell: powershell
        run: |
          $dir = "dist"
          Get-ChildItem $dir -Filter "*.exe" | ForEach-Object {
            Copy-Item $_.FullName "$dir\A-share-stock-analyzer.exe" -Force
          }
          Get-ChildItem $dir -Filter "*.exe" | ForEach-Object {
            Write-Host "Build complete: $($_.Name) ($([math]::Round($_.Length / 1MB, 1)) MB)"
          }

      # 6. 提取版本号（从 git tag）
      - name: Get version from tag
        id: get_version
        shell: powershell
        run: |
          $tag = $env:GITHUB_REF_NAME
          if (-not $tag) { $tag = "v5.0.0" }
          echo "tag=$tag" | Out-File -Append -FilePath $env:GITHUB_OUTPUT

      # 7. 发布到 GitHub Releases（仅推送 tag 时）
      - name: Create Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          body: |
            🚀 A股智能股票分析工具 ${{ github.ref_name }}

            ## 下载
            - **A-share-stock-analyzer.exe** — Windows 单文件版（免安装）

            ## 使用说明
            1. 下载 exe 后，在**同目录**新建 `.env` 文件：
               ```
               DEEPSEEK_API_KEY=你的DeepSeek密钥
               ```
            2. 双击 exe 启动，浏览器自动打开 http://127.0.0.1:8000
            3. 关闭黑色窗口即停止服务

            > ⚠️ 本工具仅供技术学习研究，不构成投资建议。
          files: |
            dist/A-share-stock-analyzer.exe
          fail_on_unmatched_files: true
